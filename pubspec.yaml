name: my_recipe_book
description: A Flutter recipe book app
version: 1.0.0
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  provider: ^6.0.0
  sqflite: ^2.0.0
  path_provider: ^2.0.0
  image_picker: ^1.1.2
  excel: ^4.0.6
  share_plus: ^11.0.0
  shared_preferences: ^2.0.0
  flutter_screenutil: ^5.0.0 # Added for responsive UI
  pdf: ^3.8.0
  flutter_launcher_icons: ^0.14.4
  file_picker: ^10.2.0
  flutter_image_compress: ^2.4.0
  archive: ^3.6.1
  auto_size_text: ^3.0.0
  animations: ^2.0.0 # Added for page transition animations
  path: ^1.8.0
  permission_handler: ^12.0.1
  # Sous Chef 모드용 데이터베이스
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # 발효 타이머 알림 시스템
  vibration: ^3.1.3
  flutter_local_notifications: ^17.2.2
  # JSON 직렬화
  json_annotation: ^4.8.1
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/dinner_dining.png
    - assets/fonts/NotoSansKR-VariableFont_wght.ttf
    - assets/fonts/NotoSansJP-VariableFont_wght.ttf
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/dinner_dining.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  mockito: ^5.4.4