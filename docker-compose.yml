version: '3.8'
services:
  conductor-server:
    image: orkesio/orkes-conductor-community-server:latest
    ports:
      - "8080:8080"
    environment:
      - "CONDUCTOR_CONFIG_FILE=/app/config/config.properties"

  conductor-ui:
    image: orkesio/orkes-conductor-community-ui:latest
    ports:
      - "5000:5000"
    environment:
      - "VITE_APP_CONDUCTOR_SERVER_URL=http://conductor-server:8080/api"
    depends_on:
      - conductor-server